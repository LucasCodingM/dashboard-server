services:
  dashboard:
    build: .
    container_name: dashboard-server
    restart: unless-stopped
    network_mode: host
    pid: host
    env_file:
      - .env
    environment:
      - IS_DOCKER=true
      - DECLIN_DISCORD_PATH=/declin-discord
      - DECLIN_WEB_PATH=/declin-web
    volumes:
      # Docker daemon host (contrôle des services)
      - /var/run/docker.sock:/var/run/docker.sock
      # Sources des projets pour docker compose
      - ${DECLIN_DISCORD_PATH:-../declin-discord}:/declin-discord
      - ${DECLIN_WEB_PATH:-../declin-web}:/declin-web
      # Chemins de stockage (définis dans .env)
      - ${BROWSE_ROOT:-/stockage}:${BROWSE_ROOT:-/stockage}
      - ${DOWNLOAD_PATH:-/stockage/telechargements}:${DOWNLOAD_PATH:-/stockage/telechargements}
    privileged: true
    user: root
